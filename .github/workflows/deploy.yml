# ============================================================
#  SEFELEC — Publication automatique sur Nindohost
# ============================================================
# Se déclenche à chaque « git push » sur la branche principale et
# envoie le site public par FTP vers l'hébergement.
#
# Seuls les fichiers du site partent en ligne. Le back-office (cms/),
# les outils (tools/) et la base de données restent sur votre machine.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER    — ex. ftp.sefelec.ma
#   FTP_USERNAME  — identifiant FTP cPanel
#   FTP_PASSWORD  — mot de passe FTP
#   FTP_DIRECTORY — dossier cible, généralement public_html/

name: Déploiement Nindohost

on:
  push:
    # Selon la langue de votre compte, GitHub nomme la branche « main » ou
    # « principal ». Les trois noms courants sont acceptés : la publication
    # se déclenche quel que soit celui de votre dépôt.
    branches: [main, principal, master]
  # Permet aussi de relancer une publication manuellement
  # depuis l'onglet Actions de GitHub.
  workflow_dispatch:

jobs:
  deploy:
    name: Publier sur l'hébergement
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Contrôler que le contenu a bien été généré
        run: |
          if [ ! -f assets/data/content.json ]; then
            echo "::error::assets/data/content.json est absent."
            echo "Lancez 'npm run build' en local, puis committez le résultat."
            exit 1
          fi

          produits=$(grep -o '"ref"' assets/data/content.json | wc -l)
          images=$(ls assets/images/content 2>/dev/null | wc -l)

          echo "Contenu : $produits produits, $images images"

          if [ "$images" -eq 0 ]; then
            echo "::warning::Aucune image générée. Le site s'affichera sans visuels produits."
          fi

      - name: Contrôler que les accès FTP sont renseignés
        env:
          SERVEUR: ${{ secrets.FTP_SERVER }}
          UTILISATEUR: ${{ secrets.FTP_USERNAME }}
          MOTDEPASSE: ${{ secrets.FTP_PASSWORD }}
        run: |
          manquants=""
          if [ -z "$SERVEUR" ];     then manquants="$manquants FTP_SERVER"; fi
          if [ -z "$UTILISATEUR" ]; then manquants="$manquants FTP_USERNAME"; fi
          if [ -z "$MOTDEPASSE" ];  then manquants="$manquants FTP_PASSWORD"; fi

          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants"
            echo "Créez-les dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Accès FTP renseignés."

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Sans secret FTP_DIRECTORY, on vise public_html/ : c'est la racine
          # du site sur la quasi-totalité des hébergements cPanel.
          server-dir: ${{ secrets.FTP_DIRECTORY || 'public_html/' }}
          # Si Nindohost refuse le FTPS, remplacez « ftps » par « ftp ».
          protocol: ftps
          # Tout ce qui ne fait pas partie du site public est exclu.
          #
          # ATTENTION — ne pas exclure ici assets/data/content.json ni
          # assets/images/content/. Ces fichiers ont déjà été transférés :
          # les exclure les ferait passer pour supprimés, et l'outil les
          # effacerait du serveur. Le partage entre contenu géré en ligne
          # et code déployé se règle autrement (voir admin/LISEZ-MOI.md).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cms/**
            tools/**
            .github/**
            server.js
            package.json
            package-lock.json
            **/*.cmd
            **/*.md
            **/*.mp4
            **/*.zip
            **/*.pdf

      # Sans ce contrôle, un transfert vers le mauvais dossier réussit
      # sans rien publier : le workflow s'affichait au vert alors que le
      # site en ligne restait inchangé. Le cas s'est produit.
      - name: Vérifier que le site en ligne a bien changé
        run: |
          SITE="${{ secrets.SITE_URL || 'https://www.sefelec.ma' }}"
          echo "Contrôle sur $SITE"

          # On laisse le temps au serveur d'exposer les fichiers.
          sleep 20

          attendu=$(grep -c '<loc>' sitemap.xml)
          enligne=$(curl -s --max-time 30 "$SITE/sitemap.xml" | grep -c '<loc>' || echo 0)

          echo "Adresses attendues : $attendu"
          echo "Adresses en ligne  : $enligne"

          if [ "$enligne" -ne "$attendu" ]; then
            echo "::error::Le transfert s'est terminé sans erreur, mais le site en ligne n'a pas changé."
            echo "Cause la plus fréquente : le secret FTP_DIRECTORY ne désigne pas la racine du site."
            echo "Si le compte FTP a déjà public_html pour dossier de départ, FTP_DIRECTORY doit valoir ./"
            exit 1
          fi

          echo "Le site en ligne correspond au dépôt."

      - name: Récapitulatif
        run: |
          echo "### Publication terminée :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Le site a été transféré vers l'hébergement." >> $GITHUB_STEP_SUMMARY
          echo "Vérifiez le résultat sur votre domaine." >> $GITHUB_STEP_SUMMARY
